<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueNeverStory — MCP Console</title>
<link href="/static/fonts/fonts.css" rel="stylesheet">
<link href="/static/theme-dark.css" rel="stylesheet">
<link href="/static/theme-light.css" rel="stylesheet">
<link href="/static/theme-terminal.css" rel="stylesheet">
<link href="/static/theme-cyberpunk.css" rel="stylesheet">
<link href="/static/theme-custom.css" rel="stylesheet">
<link href="/static/theme.css" rel="stylesheet">
<script src="/static/theme.js"></script>
<style>
:root{--font-body:'Space Grotesk',system-ui,sans-serif;--font-mono:'Space Mono',monospace;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;--ease-out:cubic-bezier(.22,.61,.36,1);--dur-fast:120ms;--dur-normal:200ms;--dur-slow:340ms}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:var(--black);overflow:hidden}
body{height:100%;background:var(--black);font-family:var(--font-mono);font-size:14px;color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;user-select:none}

.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:48px;border-bottom:1px solid var(--border);flex-shrink:0}
.topbar__brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-disabled)}
.topbar__brand span{color:var(--text-display);font-weight:700}
.topbar__sep{width:1px;height:18px;background:var(--border)}
.topbar__title{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary)}
.topbar__spacer{flex:1}
.topbar__btn{background:transparent;border:1px solid var(--border-visible);color:var(--text-tertiary);font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 16px;cursor:pointer;border-radius:var(--radius-pill);transition:all var(--dur-fast);text-decoration:none;display:inline-flex;align-items:center}
.topbar__btn:hover{border-color:var(--text-secondary);color:var(--text-primary)}

.tabs{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{background:transparent;border:1px solid transparent;color:var(--text-tertiary);font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 16px;cursor:pointer;border-radius:var(--radius-pill);transition:all var(--dur-fast);white-space:nowrap}
.tab:hover{color:var(--text-secondary);border-color:var(--border)}
.tab.active{color:var(--text-display);border-color:var(--accent);background:rgba(var(--accent-rgb),.1)}

.content{flex:1;overflow-y:auto;padding:20px 24px}
.content::-webkit-scrollbar{width:2px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border-visible);border-radius:2px}

.panel{display:none}
.panel.active{display:block}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:4px}
.stat-card__value{font-family:var(--font-body);font-size:28px;font-weight:700;color:var(--text-display);line-height:1}
.stat-card__label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-disabled)}

.section{margin-bottom:20px}
.section__title{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section__title::after{content:'';flex:1;height:1px;background:var(--border)}

.btn{background:var(--surface-raised);border:1px solid var(--border-visible);color:var(--text-primary);font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 20px;cursor:pointer;border-radius:var(--radius-md);transition:all var(--dur-fast)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn--danger{border-color:var(--error);color:var(--error)}
.btn--success{border-color:var(--success);color:var(--success)}

.input{background:var(--surface);border:1px solid var(--border);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;padding:8px 12px;border-radius:var(--radius-md);width:100%;outline:none;transition:border-color var(--dur-fast)}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text-disabled)}

.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row .input{flex:1}

.result-table{width:100%;border-collapse:collapse;font-size:13px}
.result-table th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.result-table td{padding:8px 12px;border-bottom:1px solid var(--border-light);color:var(--text-primary)}
.result-table tr:hover td{background:var(--surface-raised)}

.toast-container{position:fixed;top:60px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;color:var(--text-primary);animation:slideIn var(--dur-normal) var(--ease-out);min-width:280px;max-width:400px}
.toast--success{border-color:var(--success)}
.toast--error{border-color:var(--error)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.empty{color:var(--text-disabled);font-style:italic;padding:20px;text-align:center}

.result-box{margin-top:8px;padding:12px;background:var(--surface-raised);border-radius:var(--radius-md);font-size:13px;white-space:pre-wrap;max-height:300px;overflow-y:auto}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__brand">TrueNeverStory &mdash; <span>MCP Console</span></div>
  <div class="topbar__sep"></div>
  <div class="topbar__title" data-i18n="mcp.title">Database Management</div>
  <div class="topbar__spacer"></div>
  <a href="/" class="topbar__btn" data-i18n="mcp.back">&larr; Back</a>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="dashboard" data-i18n="mcp.tab.dashboard">Dashboard</button>
  <button class="tab" data-tab="bible" data-i18n="mcp.tab.bible">Bible</button>
  <button class="tab" data-tab="gutenberg" data-i18n="mcp.tab.gutenberg">Gutenberg</button>
  <button class="tab" data-tab="catalog" data-i18n="mcp.tab.catalog">Catalog</button>
  <button class="tab" data-tab="wikipedia" data-i18n="mcp.tab.wikipedia">Wikipedia</button>
  <button class="tab" data-tab="literary" data-i18n="mcp.tab.literary">Literary</button>
  <button class="tab" data-tab="economics" data-i18n="mcp.tab.economics">Economics</button>
  <button class="tab" data-tab="system" data-i18n="mcp.tab.system">System</button>
</div>

<div class="content">
  <!-- Dashboard -->
  <div class="panel active" id="panel-dashboard">
    <div class="stats-grid" id="dashboard-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.quickActions">Quick Actions</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="compactAll()" data-i18n="mcp.compactAll">Compact All</button>
        <button class="btn" onclick="rebuildIndex()" data-i18n="mcp.rebuildIndex">Rebuild Index</button>
      </div>
    </div>
  </div>

  <!-- Bible -->
  <div class="panel" id="panel-bible">
    <div class="stats-grid" id="bible-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.bible.search">Search Verses</div>
      <div class="search-row">
        <input class="input" id="bible-q" placeholder="Search verses..." data-i18n-placeholder="mcp.bible.searchPlaceholder">
        <button class="btn" onclick="searchBible()" data-i18n="mcp.search">Search</button>
      </div>
      <div id="bible-results"></div>
    </div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.bible.characters">Characters</div>
      <div class="search-row">
        <input class="input" id="bible-char-q" placeholder="Search characters..." data-i18n-placeholder="mcp.bible.charPlaceholder">
        <button class="btn" onclick="searchBibleChars()" data-i18n="mcp.search">Search</button>
      </div>
      <div id="bible-char-results"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn--success" onclick="runAction('bible/bootstrap')" data-i18n="mcp.bible.bootstrap">Bootstrap</button>
      <button class="btn" onclick="runAction('bible/compact')" data-i18n="mcp.bible.compact">Compact</button>
    </div>
  </div>

  <!-- Gutenberg -->
  <div class="panel" id="panel-gutenberg">
    <div class="stats-grid" id="gutenberg-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.gutenberg.search">Search Styles</div>
      <div class="search-row">
        <input class="input" id="gutenberg-q" placeholder="Search styles..." data-i18n-placeholder="mcp.gutenberg.searchPlaceholder">
        <button class="btn" onclick="searchGutenberg()" data-i18n="mcp.search">Search</button>
      </div>
      <div id="gutenberg-results"></div>
    </div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.gutenberg.delexify">Delexify Text</div>
      <textarea class="input" id="gutenberg-delex" rows="4" placeholder="Paste text to delexify..." data-i18n-placeholder="mcp.gutenberg.delexifyPlaceholder" style="resize:vertical"></textarea>
      <button class="btn" onclick="delexifyGutenberg()" style="margin-top:8px" data-i18n="mcp.gutenberg.delexifyBtn">Delexify</button>
      <div id="gutenberg-delex-result"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="runAction('gutenberg/download')" data-i18n="mcp.gutenberg.download">Download Corpus</button>
      <button class="btn" onclick="runAction('gutenberg/convert')" data-i18n="mcp.gutenberg.convert">Convert</button>
      <button class="btn" onclick="runAction('gutenberg/compact')" data-i18n="mcp.gutenberg.compact">Compact</button>
    </div>
  </div>

  <!-- Catalog (Selective Download) -->
  <div class="panel" id="panel-catalog">
    <div class="stats-grid" id="catalog-stats"></div>
    <div class="section">
      <div class="section__title">Build Catalog</div>
      <div class="search-row">
        <input class="input" id="catalog-authors" placeholder="Authors (comma-separated): Mark Twain, Jack London...">
        <input class="input" id="catalog-topic" placeholder="Topic (optional): adventure, romance..." style="max-width:200px">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn btn--success" onclick="buildCatalog()">Build Catalog</button>
        <button class="btn" onclick="buildCatalogPopular()">Popular 500</button>
      </div>
      <div id="catalog-build-progress" style="display:none">
        <div style="background:var(--surface);border-radius:var(--radius-md);padding:8px 12px;font-size:12px">
          <div id="catalog-build-status">Starting...</div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section__title">Search & Filter</div>
      <div class="search-row">
        <input class="input" id="catalog-q" placeholder="Search by title, author, subjects...">
        <button class="btn" onclick="searchCatalog()">Search</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <input class="input" id="catalog-filter-author" placeholder="Author" style="max-width:200px">
        <input class="input" id="catalog-filter-year-from" placeholder="Year from" style="max-width:120px" type="number">
        <input class="input" id="catalog-filter-year-to" placeholder="Year to" style="max-width:120px" type="number">
        <input class="input" id="catalog-filter-min-dl" placeholder="Min downloads" style="max-width:140px" type="number">
        <button class="btn" onclick="filterCatalog()">Apply</button>
        <button class="btn" onclick="clearCatalogFilter()">Clear</button>
      </div>
    </div>
    <div class="section">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn" onclick="selectAllCatalog()">Select All</button>
        <button class="btn" onclick="deselectAllCatalog()">Deselect All</button>
        <button class="btn btn--success" onclick="downloadSelectedCatalog()">Download Selected</button>
        <span id="catalog-selected-count" style="color:var(--text-secondary);font-size:12px;display:flex;align-items:center"></span>
      </div>
      <div id="catalog-results"></div>
      <div id="catalog-pagination" style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px"></div>
    </div>
  </div>

  <!-- Wikipedia -->
  <div class="panel" id="panel-wikipedia">
    <div class="stats-grid" id="wikipedia-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.wikipedia.search">Search Articles</div>
      <div class="search-row">
        <input class="input" id="wikipedia-q" placeholder="Search Wikipedia..." data-i18n-placeholder="mcp.wikipedia.searchPlaceholder">
        <button class="btn" onclick="searchWikipedia()" data-i18n="mcp.search">Search</button>
      </div>
      <div id="wikipedia-results"></div>
    </div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.wikipedia.verify">Fact Verification</div>
      <div class="search-row">
        <input class="input" id="wikipedia-claim" placeholder="Enter a claim to verify..." data-i18n-placeholder="mcp.wikipedia.claimPlaceholder">
        <button class="btn" onclick="verifyWikipedia()" data-i18n="mcp.wikipedia.verifyBtn">Verify</button>
      </div>
      <div id="wikipedia-verify-result"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="runAction('wikipedia/download')" data-i18n="mcp.wikipedia.download">Download</button>
      <button class="btn" onclick="runAction('wikipedia/convert')" data-i18n="mcp.wikipedia.convert">Convert</button>
      <button class="btn" onclick="runAction('wikipedia/compact')" data-i18n="mcp.wikipedia.compact">Compact</button>
    </div>
  </div>

  <!-- Literary -->
  <div class="panel" id="panel-literary">
    <div class="stats-grid" id="literary-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.literary.templates">Quest Templates</div>
      <div class="search-row">
        <input class="input" id="literary-q" placeholder="Search templates..." data-i18n-placeholder="mcp.literary.searchPlaceholder">
        <button class="btn" onclick="searchLiterary()" data-i18n="mcp.search">Search</button>
      </div>
      <div id="literary-results"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn--success" onclick="runAction('literary/compile')" data-i18n="mcp.literary.compile">Compile</button>
      <button class="btn" onclick="runAction('literary/compact')" data-i18n="mcp.literary.compact">Compact</button>
    </div>
  </div>

  <!-- Economics -->
  <div class="panel" id="panel-economics">
    <div class="stats-grid" id="economics-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.economics.phase">Current Phase</div>
      <div id="economics-phase" class="empty">Loading...</div>
    </div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.economics.dilemma">Generate Dilemma</div>
      <button class="btn" onclick="generateDilemma()" data-i18n="mcp.economics.generateBtn">Generate</button>
      <div id="economics-dilemma"></div>
    </div>
  </div>

  <!-- System -->
  <div class="panel" id="panel-system">
    <div class="stats-grid" id="system-stats"></div>
    <div class="section">
      <div class="section__title" data-i18n="mcp.system.logs">Operation Logs</div>
      <div id="system-logs" style="max-height:300px;overflow-y:auto;font-size:12px"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="runAction('rebuild-index')" data-i18n="mcp.system.rebuildIndex">Rebuild Index</button>
      <button class="btn btn--danger" onclick="runAction('clean-orphans')" data-i18n="mcp.system.cleanOrphans">Clean Orphans</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

document.querySelectorAll(".tab").forEach(tab => {

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type ? " toast--" + type : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── API ───────────────────────────────────────────────────────
async function api(path, opts) {
  try {
    const res = await fetch("/mcp/" + path, { headers: { "Content-Type": "application/json" }, ...opts });
    return await res.json();
  } catch (err) { toast("API error: " + err.message, "error"); return null; }
}

function fmtBytes(b) {
  if (!b) return "0 B";
  const k = 1024, s = ["B","KB","MB","GB"];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return (b / Math.pow(k, i)).toFixed(1) + " " + s[i];
}

}

let catalogPage = 1;

async function loadCatalogStats() {

  el.innerHTML = `<div class="stat-card"><div class="stat-card__value">${d.total||0}</div><div class="stat-card__label">Total</div></div><div class="stat-card"><div class="stat-card__value">${d.downloaded||0}</div><div class="stat-card__label">Downloaded</div></div><div class="stat-card"><div class="stat-card__value">${d.selected||0}</div><div class="stat-card__label">Selected</div></div>`;

async function loadCatalogPage(page) {
  catalogPage = page || 1;
  const d = await api(`gutenberg/catalog?page=${catalogPage}&limit=50&sort=${catalogSort}&order=${catalogOrder}`);
  if (!d) return;
  renderCatalogTable(d.books, d.total, d.page, d.totalPages);
}

function renderCatalogTable(books, total, page, totalPages) {
  const el = document.getElementById("catalog-results");
  if (!books?.length) { el.innerHTML = '<div class="empty">No books in catalog</div>'; return; }
  el.innerHTML = '<table class="result-table"><tr><th><input type="checkbox" onchange="toggleAllCatalog(this.checked)"></th><th>#</th><th>Title</th><th>Author</th><th>Subjects</th><th>Downloads</th><th>Words</th><th>Status</th></tr>' +
    books.map(b => `<tr><td><input type="checkbox" data-etextno="${b.etextno}" ${b.selected?'checked':''} onchange="toggleCatalogBook(${b.etextno},this.checked)"></td><td>${b.etextno}</td><td>${b.title}</td><td>${b.author}</td><td>${(b.subjects||[]).slice(0,2).join(', ')}</td><td>${(b.download_count||0).toLocaleString()}</td><td>${(b.word_count||0).toLocaleString()}</td><td>${b.downloaded?'<span style="color:var(--success)">✓</span>':'<span style="color:var(--text-disabled)">—</span>'}</td></tr>`).join("") + '</table>';
  const pag = document.getElementById("catalog-pagination");
  pag.innerHTML = `<button class="btn" onclick="loadCatalogPage(${page-1})" ${page<=1?'disabled':''}>Prev</button><span style="color:var(--text-secondary);font-size:12px">Page ${page}/${totalPages}</span><button class="btn" onclick="loadCatalogPage(${page+1})" ${page>=totalPages?'disabled':''}>Next</button>`;
}

async function buildCatalog() {
  const authors = document.getElementById("catalog-authors").value;
  const topic = document.getElementById("catalog-topic").value;
  if (!authors && !topic) { toast("Enter authors or topic", "error"); return; }
  const body = {};
  if (authors) body.authors = authors.split(",").map(s => s.trim());
  if (topic) body.topic = topic;
  const d = await api("gutenberg/catalog/build", { method: "POST", body: JSON.stringify(body) });
  if (d?.job_id) {
    document.getElementById("catalog-build-progress").style.display = "block";
    document.getElementById("catalog-build-status").textContent = "Building catalog...";
    toast("Catalog build started", "success");
  }
}

  const d = await api("gutenberg/catalog/build", { method: "POST", body: JSON.stringify({ limit: 500 }) });

    document.getElementById("catalog-build-status").textContent = "Building popular catalog...";

async function searchCatalog() {

  renderCatalogTable(d.results, d.results.length, 1, 1);
}

async function filterCatalog() {
  const params = new URLSearchParams();
  const author = document.getElementById("catalog-filter-author").value;
  const yearFrom = document.getElementById("catalog-filter-year-from").value;
  const yearTo = document.getElementById("catalog-filter-year-to").value;
  const minDl = document.getElementById("catalog-filter-min-dl").value;
  if (author) params.set("author", author);
  if (yearFrom) params.set("year_from", yearFrom);
  if (yearTo) params.set("year_to", yearTo);
  if (minDl) params.set("min_downloads", minDl);
  const d = await api("gutenberg/catalog/filter?" + params.toString());
  if (!d?.results?.length) { document.getElementById("catalog-results").innerHTML = '<div class="empty">No results</div>'; return; }
  renderCatalogTable(d.results, d.results.length, 1, 1);
}

function clearCatalogFilter() {
  document.getElementById("catalog-filter-author").value = "";
  document.getElementById("catalog-filter-year-from").value = "";
  document.getElementById("catalog-filter-year-to").value = "";
  document.getElementById("catalog-filter-min-dl").value = "";
  loadCatalogPage(1);
}

function addLog(msg) {
  LOGS.unshift({ time: new Date().toLocaleTimeString(), msg });
  if (LOGS.length > 50) LOGS.pop();
  const el = document.getElementById("system-logs");
  if (el) el.innerHTML = LOGS.map(l => `<div style="padding:4px 0;border-bottom:1px solid var(--border-light)"><span style="color:var(--text-disabled)">${l.time}</span> ${l.msg}</div>`).join("");
}

// ── Actions ───────────────────────────────────────────────────
async function runAction(path) {
  toast("Starting: " + path);
  addLog("Starting: " + path);
  try {
    const res = await fetch("/mcp/" + path, { method: "POST" });
    const data = await res.json();
    if (data.jobId) {
      trackProgress(data.jobId, path);
    } else {
      toast("Done: " + path, "success");
      addLog("Completed: " + path);
      loadTab(document.querySelector(".tab.active").dataset.tab);
    }
  } catch (err) {
    toast("Error: " + err.message, "error");
    addLog("Error: " + path + " \u2014 " + err.message);
  }
}

function trackProgress(jobId, path) {
  const es = new EventSource("/mcp/stream/" + jobId);
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    addLog(path + ": " + d.message + " (" + d.progress + "%)");
    if (d.status === "done" || d.status === "error") {
      es.close();
      toast(d.status === "done" ? "Completed: " + path : "Error: " + path, d.status === "done" ? "success" : "error");
      loadTab(document.querySelector(".tab.active").dataset.tab);
    }
  };
  es.onerror = () => es.close();
}

async function compactAll() {
  for (const p of ["bible/compact","gutenberg/compact","wikipedia/compact","literary/compact"]) await runAction(p);
}
async function rebuildIndex() { await runAction("rebuild-index"); }

// ── Tab loader ────────────────────────────────────────────────
const loaders = { dashboard: loadDashboard, bible: loadBibleStats, gutenberg: loadGutenbergStats, catalog: () => { loadCatalogStats(); loadCatalogPage(1); }, wikipedia: loadWikipediaStats, literary: loadLiteraryStats, economics: loadEconomicsStats, system: loadSystemStats };
function loadTab(tab) { loaders[tab]?.(); }

setInterval(() => { const a = document.querySelector(".tab.active")?.dataset.tab; if (a) loadTab(a); }, 10000);
